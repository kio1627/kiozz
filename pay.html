<!DOCTYPE html>
<html lang="zh-CN">

<head>

<meta charset="UTF-8">

<meta
name="viewport"
content="width=device-width,initial-scale=1.0"
>

<title>确认订单 - 跨境电商专线</title>

<style>

*{
    box-sizing:border-box;
}

body{

    margin:0;

    background:#070b14;

    color:#eef4ff;

    font-family:
    -apple-system,
    BlinkMacSystemFont,
    "Segoe UI",
    "PingFang SC",
    "Microsoft YaHei",
    sans-serif;

}

.box{

    max-width:620px;

    margin:auto;

    padding:55px 20px 70px;

}

.back{

    color:#78bfff;

    text-decoration:none;

    font-size:14px;

}

.title{

    text-align:center;

    margin:35px 0;

}

.title h1{

    font-size:32px;

    margin:0 0 10px;

}

.title p{

    color:#8e9bad;

    margin:0;

}

.order{

    background:
    linear-gradient(
        145deg,
        #111a29,
        #0d1420
    );

    border:1px solid #28384d;

    border-radius:25px;

    padding:30px;

    box-shadow:
    0 20px 60px #0005;

}

.row{

    display:flex;

    justify-content:space-between;

    padding:15px 0;

    border-bottom:
    1px solid #243143;

    color:#aab6c7;

}

.row strong{

    color:#fff;

    text-align:right;

}

.total{

    font-size:30px;

    color:#49b7ff;

    font-weight:800;

    margin:24px 0;

}

label{

    display:block;

    margin:16px 0 8px;

}

.required{

    color:#55b5ff;

}

input{

    width:100%;

    padding:15px;

    border:1px solid #304057;

    border-radius:12px;

    background:#0a111d;

    color:#fff;

    font-size:15px;

    outline:none;

}

input:focus{

    border-color:#3189d8;

    box-shadow:
    0 0 0 3px #3189d822;

}

.email-tip{

    color:#748197;

    font-size:12px;

    line-height:1.7;

    margin-top:10px;

}

.pay{

    margin-top:24px;

    padding:15px;

    border:1px solid #315a7f;

    border-radius:13px;

    background:#0c1725;

}

.pay b{

    display:block;

    margin-bottom:4px;

}

.pay span{

    color:#7f8da1;

    font-size:12px;

}

button{

    width:100%;

    margin-top:22px;

    padding:15px;

    border:0;

    border-radius:13px;

    background:#187ee0;

    color:#fff;

    font-size:16px;

    font-weight:700;

    cursor:pointer;

}

button:hover{

    filter:brightness(1.12);

}

.support{

    text-align:center;

    margin-top:20px;

    padding:14px;

    background:#0b1421;

    border:1px solid #28415d;

    border-radius:12px;

    color:#aab6c7;

    font-size:13px;

}

.support a{

    color:#55b5ff;

    text-decoration:none;

    font-weight:700;

}

.tip{

    color:#748197;

    font-size:12px;

    text-align:center;

    line-height:1.7;

    margin-top:18px;

}

@media(max-width:600px){

    .order{

        padding:24px;

    }

    .title h1{

        font-size:29px;

    }

}

</style>

</head>


<body>


<div class="box">


<a
class="back"
href="index.html"
>
← 返回套餐
</a>


<div class="title">

<h1>
确认订单
</h1>

<p>
跨境电商专线
</p>

</div>


<div class="order">


<div class="row">

<span>
套餐
</span>

<strong id="name">
-
</strong>

</div>


<div class="row">

<span>
流量
</span>

<strong id="traffic">
-
</strong>

</div>


<div class="row">

<span>
有效期
</span>

<strong id="duration">
-
</strong>

</div>


<div class="total">

¥<span id="price">0</span>

</div>


<label>

接收邮箱

<span class="required">
*
</span>

</label>


<input
id="email"
type="email"
placeholder="请输入接收邮箱（必填）"
autocomplete="email"
>


<div class="email-tip">

下单请填写接收邮箱，
必须填写邮箱才能支付。

</div>


<div class="pay">

<b>
支付宝支付
</b>

<span>
支持支付宝扫码或跳转支付
</span>

</div>


<button onclick="goPay()">

立即支付

</button>


<div class="support">

如遇问题联系

<a
href="https://t.me/kio_037"
target="_blank"
>
@kio_037
</a>

</div>


<div class="tip">

请确认套餐、价格和接收邮箱无误后再进行支付。

</div>


</div>

</div>


<script>

const params =
new URLSearchParams(
window.location.search
);


document.getElementById(
"name"
).textContent =
params.get("name")
|| "未选择套餐";


document.getElementById(
"price"
).textContent =
params.get("price")
|| "0";


document.getElementById(
"traffic"
).textContent =
params.get("traffic")
|| "-";


document.getElementById(
"duration"
).textContent =
params.get("duration")
|| "-";


function goPay(){

    const email =
    document
    .getElementById("email")
    .value
    .trim();


    if(!email){

        alert(
            "请先填写接收邮箱"
        );

        return;

    }


    const emailReg =
    /^[^\s@]+@[^\s@]+\.[^\s@]+$/;


    if(!emailReg.test(email)){

        alert(
            "请输入正确的邮箱地址"
        );

        return;

    }


    const pay =
    params.get("pay");


    if(!pay){

        alert(
            "暂未配置支付链接，请联系客服"
        );

        return;

    }


    window.location.href =
    pay;

}

</script>


</body>

</html>
